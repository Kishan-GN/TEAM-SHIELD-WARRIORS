<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARGUS-X · Video intelligence</title><link rel="stylesheet" href="platform.css"></head><body>
<section id="gate"><div class="login"><div class="word">◎ ARGUS–X</div><h1 id="authTitle">Local workspace</h1><p id="authHint">Open the workspace with Start-Analytics.bat.</p><form id="auth"><label>Account<input id="account" required maxlength="48" autocomplete="username"></label><label>Password<input id="pass" type="password" required autocomplete="current-password"></label><button class="main">Enter workspace</button></form><p id="authError" role="alert"></p><a href="../index.html">Object finder</a></div></section>
<div id="shell" hidden><aside><div class="word">◎ ARGUS–X</div><nav id="nav"></nav><a href="../index.html">Object finder ↗</a><button id="logout">Sign out</button></aside><main><header><div><small>ARGUS–X / VIDEO INTELLIGENCE</small><h1 id="title"></h1></div><span id="who"></span></header><div id="notice" role="status"></div><section id="controls" hidden><div class="card toolbar"><label>Camera name<input id="camName" value="Desk camera" maxlength="80"></label><label>Device<select id="device"><option value="">Default camera</option></select></label><button id="devices">List devices</button><label class="inline"><input type="checkbox" id="authorized"> Authorized capture</label><label class="inline"><input type="checkbox" id="returnMode"> Participants agreed to entry photos and persistent IDs</label><label class="inline"><input type="checkbox" id="record"> Save clip (up to 60 s)</label><button id="start" class="main">Start camera</button></div></section><section id="searchControls" hidden><div class="card toolbar"><label>Authorized MP4 or WebM · max 32 MB<input id="upload" type="file" accept="video/mp4,video/webm"></label><label class="inline"><input type="checkbox" id="fileConsent"> Authorized to index and store</label><label class="inline"><input type="checkbox" id="fileReturnMode"> Participants agreed to entry photos and persistent IDs</label><button id="indexClip" class="main">Index video</button></div></section><div id="sources"></div><section id="content"></section></main></div><dialog id="dialog"><div id="dialogContent"></div><button id="closeDialog">Close</button></dialog><script src="../tracker.js"></script><script src="watch.js"></script><script src="appearance.js"></script><script src="platform.js"></script></body></html>
